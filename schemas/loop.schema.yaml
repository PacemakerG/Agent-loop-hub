$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://agent-loop-hub.dev/schemas/loop.schema.yaml"
title: Agent Loop
description: Minimal schema for describing a reusable AI Agent workflow loop.
type: object
required:
  - name
  - slug
  - summary
  - roles
  - flow
  - state
properties:
  name:
    type: string
    example: OpenSpec Dev Loop
  slug:
    type: string
    pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
    example: openspec-dev-loop
  summary:
    type: string
  tagline:
    type: string
  roles:
    type: array
    minItems: 1
    items:
      type: object
      required:
        - name
        - responsibilities
      properties:
        name:
          type: string
        responsibilities:
          type: array
          items:
            type: string
        boundaries:
          type: array
          items:
            type: string
  flow:
    type: array
    minItems: 1
    items:
      type: string
  human_checkpoints:
    type: array
    items:
      type: string
  state:
    type: object
    required:
      - storage
      - fields
    properties:
      storage:
        type: string
        example: .agent-loop/state.md
      fields:
        type: array
        items:
          type: string
  heartbeat:
    type: object
    properties:
      enabled:
        type: boolean
      intervals:
        type: object
        additionalProperties:
          type: string
  prompts:
    type: array
    items:
      type: string
additionalProperties: true
