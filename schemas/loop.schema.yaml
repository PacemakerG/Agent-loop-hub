$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://agent-loop-hub.dev/schemas/loop.schema.yaml"
title: Agent Loop Metadata
description: Minimal schema for loop.yaml files in Agent Loop Hub.
type: object
required:
  - name
  - category
  - description
  - roles
  - human_checkpoints
  - state_file
properties:
  name:
    type: string
    example: OpenSpec Dev Loop
  slug:
    type: string
    pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
    example: openspec-dev-loop
  category:
    type: string
    example: coding
  description:
    type: string
  summary:
    type: string
  tagline:
    type: string
  roles:
    type: array
    minItems: 1
    items:
      type: string
      example: Planner
  flow:
    type: array
    minItems: 1
    items:
      type: string
  human_checkpoints:
    type: array
    items:
      type: string
  state:
    type: object
    required:
      - storage
      - fields
    properties:
      storage:
        type: string
        example: .agent-loop/state.md
      fields:
        type: array
        items:
          type: string
  state_file:
    type: string
    example: .agent-loop/state.md
  status:
    type: string
    example: Ready
  heartbeat:
    type: object
    properties:
      enabled:
        type: boolean
      intervals:
        type: object
        additionalProperties:
          type: string
  prompts:
    type: array
    items:
      type: string
  source:
    type: object
    required:
      - type
    properties:
      type:
        type: string
        enum:
          - original
          - inspired_by
          - adapted_from
      name:
        type: string
      url:
        type: string
        format: uri
      license:
        type: string
      notes:
        type: string
additionalProperties: true
